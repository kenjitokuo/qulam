name: Stack Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Haskell and Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: '3.11.1'
          cabal-update: false

      - name: Check versions
        run: |
          ghc --version
          stack --version

      - name: Build
        run: stack build

      - name: Run the examples
        run: |
          set -eu
          for f in *.qlam; do
            echo "== $f"
            out=$(stack exec -- qulam-compiler "$f")
            if printf '%s\n' "$out" | grep -q '^\[parse error\]'; then
              printf '%s\n' "$out"
              echo "parse error in $f"
              exit 1
            fi
          done
          # tuple3.qlam: fst (snd (x, y, z)) normalizes to y
          stack exec -- qulam-compiler tuple3.qlam | grep -A1 '^\[nf\]' | grep -qx '  y'
